name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tank-arena .
      - run: |
          docker run -d --name game -p 2567:2567 tank-arena
          for i in $(seq 1 20); do curl -fs localhost:2567/__healthcheck && break; sleep 1; done
          curl -fs localhost:2567/ | grep -q '<div id="root">'
          curl -fs localhost:2567/api/maps | grep -q '"arena"'
