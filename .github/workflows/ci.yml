name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tank-arena .
      - run: |
          docker run -d --name game -p 2567:2567 tank-arena
          for i in $(seq 1 20); do curl -fs localhost:2567/__healthcheck && break; sleep 1; done
          curl -fs localhost:2567/ | grep -q '<div id="root">'
          curl -fs localhost:2567/api/maps | grep -q '"labyrinth"'
