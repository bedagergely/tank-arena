services:
  game:
    build: .
    image: tank-arena
    restart: unless-stopped
    environment:
      NODE_ENV: production
    expose:
      - "2567"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - game
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
      - ./deploy/nginx/40-reload-timer.sh:/docker-entrypoint.d/40-reload-timer.sh:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
