# Plain HTTP on port 80. For HTTPS, add docker-compose.tls.yml (see DEPLOY.md).
services:
  game:
    build: .
    image: tank-arena
    restart: unless-stopped
    environment:
      NODE_ENV: production
    expose:
      - "2567"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - game
    ports:
      - "80:80"
    environment:
      DOMAIN: ${DOMAIN:-_}
    volumes:
      - ./deploy/nginx/http:/etc/nginx/templates:ro
      - ./deploy/nginx/proxy.conf:/etc/nginx/snippets/proxy.conf:ro

  netdata:
    image: netdata/netdata:stable
    container_name: netdata
    pid: host
    network_mode: host
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /:/host/root:ro,rslave
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/log:/host/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/dbus:/run/dbus:ro
    environment:
      NETDATA_CLAIM_TOKEN: ${NETDATA_CLAIM_TOKEN:-}
      NETDATA_CLAIM_URL: ${NETDATA_CLAIM_URL:-https://app.netdata.cloud}
      NETDATA_CLAIM_ROOMS: ${NETDATA_CLAIM_ROOMS:-}

volumes:
  netdataconfig:
  netdatalib:
  netdatacache:
