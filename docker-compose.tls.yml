# HTTPS overlay: Let's Encrypt via certbot, nginx terminates TLS on 443.
# Enable with COMPOSE_FILE=docker-compose.yml:docker-compose.tls.yml in .env,
# then run ./deploy/init-tls.sh once to obtain the first certificate.
services:
  nginx:
    ports:
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/nginx/tls:/etc/nginx/templates:ro
      - ./deploy/nginx/40-reload-timer.sh:/docker-entrypoint.d/40-reload-timer.sh:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
